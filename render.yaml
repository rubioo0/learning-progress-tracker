services:
  - type: web
    name: learning-progress-tracker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PROVIDER
        value: postgres
      - key: FORCE_SQLITE
        value: "false"
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: qa-road-attachments
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_FILE_PERSISTENCE
        value: "false"
      - key: AI_ALLOW_MODEL_FALLBACK
        value: "true"
      - key: CODE_VALIDATION_ENABLED
        value: "false"
      - key: REQUIRE_PROD_EXTERNAL_SERVICES
        value: "true"
